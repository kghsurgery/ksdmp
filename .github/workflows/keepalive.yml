.github/workflows/keepalive.yml# Keeps the free Supabase database awake (pings it daily at 8 am PNG time).
# Needs two repository secrets: SB_URL and SB_KEY (Settings > Secrets and variables > Actions).
name: keep-alive
on:
  schedule:
    - cron: "0 22 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping KSDMP database
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SB_URL }}/rest/v1/rpc/ksdmp_ping" \
            -H "apikey: ${{ secrets.SB_KEY }}" -H "Authorization: Bearer ${{ secrets.SB_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "Supabase replied: $code"
          test "$code" = "200"
